[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-canary"
version = "0.1.0"
description = "Deterministic PHI-exfiltration oracle for evaluating tool-using LLM agents under indirect prompt injection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "phi-canary" }]
keywords = ["llm", "agent", "security", "prompt-injection", "exfiltration", "phi", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.24",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# `phi-canary open` renders in a REAL native window when pywebview is present, and falls
# back to the system browser on 127.0.0.1 when it is not. Kept an extra rather than a hard
# dependency: on macOS it pulls six pyobjc packages, and `demo`/`report`/`run` must stay a
# sub-minute install with no keys.  ->  pip install 'phi-canary[overlay]'
overlay = ["pywebview>=5.0"]

[project.scripts]
phi-canary = "phi_canary.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/phi-canary"

[tool.setuptools]
package-dir = { "phi_canary" = "src", "phi_canary.adapters" = "src/adapters" }
packages = ["phi_canary", "phi_canary.adapters"]

[tool.setuptools.package-data]
phi_canary = [
  "_bundled/*",
  "_bundled/**/*",
  "_bundled/cache/*.json",
  "_bundled/results/*",
  "_bundled/results/verify/*.json",
  "_bundled/payloads/*.yaml",
  "_bundled/data/*.json",
  "web/*.html",
]
